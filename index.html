<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSCBHa0qoBIgom92dSOZRizUW0-ZogxNKhND7K9jELlduobUUsoHL9uU4&s=10" alt="Laundry Image">
        </div>

        <!-- Right Form Section -->
        <div class="form-section">
            <h1>Hello Again!</h1>
            <p class="sub-text">Welcome back! We missed you!</p>

            <form>
                <label>Email</label>
                <input type="email" placeholder="Email@site.com">

                <label>Password</label>
                <input type="password" placeholder="Password">

                <a href="#" class="forgot">Forgot Password</a>

                <button type="submit">Login</button>

                <p class="register-text">Not a member? <span>Register Now</span></p>
            </form>
        </div>
    </div>
</body>
</html>
